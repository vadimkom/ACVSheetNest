[workspace]
resolver = "2"
members = [
    "crates/nest-geom",
    "crates/nest-nfp",
    "crates/nest-clip",
    "crates/nest-io",
    "crates/nest-engine",
    "crates/nest-sparrow",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"
authors = ["acvent.bg"]

[workspace.dependencies]
clipper2 = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rayon = "1"
nest-geom = { path = "crates/nest-geom" }
nest-nfp = { path = "crates/nest-nfp" }
nest-clip = { path = "crates/nest-clip" }
nest-io = { path = "crates/nest-io" }
nest-engine = { path = "crates/nest-engine" }

[profile.release]
opt-level = 3
